# Dynamic Agents Seed Configuration
# Generated from caipe-preview Kubernetes cluster

# =============================================================================
# Available LLM Models
# =============================================================================

models:
  - description: Fast, efficient Claude 4.5 Haiku via AWS Bedrock
    model_id: global.anthropic.claude-haiku-4-5-20251001-v1:0
    name: Claude 4.5 Haiku (Bedrock)
    provider: aws-bedrock

  - description: Balanced performance Claude Sonnet 4 via AWS Bedrock
    model_id: global.anthropic.claude-sonnet-4-20250514-v1:0
    name: Claude Sonnet 4 (Bedrock)
    provider: aws-bedrock

  - description: Latest Claude Sonnet 4.5 via AWS Bedrock
    model_id: global.anthropic.claude-sonnet-4-5-20250929-v1:0
    name: Claude Sonnet 4.5 (Bedrock)
    provider: aws-bedrock

  - description: GPT-4o via Azure OpenAI
    model_id: gpt-4o
    name: GPT-4o (Azure)
    provider: azure-openai

  - description: Fast, cost-effective GPT-4o Mini via Azure OpenAI
    model_id: gpt-4o-mini
    name: GPT-4o Mini (Azure)
    provider: azure-openai

# =============================================================================
# Seed MCP Servers
# =============================================================================
# Note: Production cluster endpoints below are disabled for local dev.
# Enable only for Kubernetes deployments where these services exist.

mcp_servers:
  - description: GitHub repositories and pull requests
    enabled: true
    endpoint: ${GITHUB_MCP_URL:-http://localhost:8082}
    id: github
    name: GitHub
    transport: http
    # Per-user GitHub OAuth token when connected; otherwise fall back to the
    # shared org PAT (GITHUB_PERSONAL_ACCESS_TOKEN) so the tools stay backward
    # compatible. AgentGateway rewrites X-CAIPE-Provider-Token into the upstream
    # Authorization: Bearer header.
    credential_sources:
      - kind: provider_connection
        name: X-CAIPE-Provider-Token
        provider: github
        target: header
        fallback_env: GITHUB_PERSONAL_ACCESS_TOKEN

  - description: GitLab repositories and merge requests
    enabled: true
    endpoint: ${GITLAB_MCP_URL:-http://localhost:18007/mcp}
    id: gitlab
    name: GitLab
    transport: http
    # Per-user GitLab OAuth token when connected; otherwise fall back to the
    # shared org PAT (GITLAB_PERSONAL_ACCESS_TOKEN). AgentGateway rewrites
    # X-CAIPE-Provider-Token into the upstream Authorization: Bearer header.
    credential_sources:
      - kind: provider_connection
        name: X-CAIPE-Provider-Token
        provider: gitlab
        target: header
        fallback_env: GITLAB_PERSONAL_ACCESS_TOKEN

  - description: ArgoCD application and deployment management
    enabled: true
    endpoint: ${ARGOCD_MCP_URL:-http://localhost:18002/mcp}
    id: argocd
    name: ArgoCD
    transport: http

  - description: Woodpecker CI pipeline and deployment status
    enabled: true
    endpoint: ${WOODPECKER_MCP_URL:-http://localhost:18014/mcp}
    id: woodpecker
    name: Woodpecker CI
    transport: http

  - description: Direct kubectl-style control over AKS clusters (restart/scale
      Deployments, pod logs/events) - kendralabs-only, opt-in
    enabled: false
    endpoint: ${KUBERNETES_OPS_MCP_URL:-http://localhost:18022/mcp}
    id: kubernetes-ops
    name: Kubernetes Ops
    transport: http

  - description: Jira issue tracking and project management
    enabled: true
    endpoint: ${JIRA_MCP_URL:-http://localhost:18004/mcp}
    id: jira
    name: Jira
    transport: http
    credential_sources:
      - kind: provider_connection
        name: X-CAIPE-Provider-Token
        provider: atlassian
        target: header

  - description: PagerDuty incident management
    enabled: true
    endpoint: ${PAGERDUTY_MCP_URL:-http://localhost:18006/mcp}
    id: pagerduty
    name: PagerDuty
    transport: http
    credential_sources:
      - kind: provider_connection
        name: X-CAIPE-Provider-Token
        provider: pagerduty
        target: header

  - description: Webex meeting, transcript, and recording tools
    enabled: true
    endpoint: ${WEBEX_MEETINGS_MCP_URL:-http://localhost:18013/mcp}
    id: webex_meetings
    name: Webex Meetings
    transport: http
    # Resolve the caller's Webex Connected App token. AgentGateway keeps the
    # caller JWT in Authorization and rewrites this provider token into the
    # Authorization header sent to the Webex Meetings MCP backend.
    credential_sources:
      - kind: provider_connection
        name: X-CAIPE-Provider-Token
        provider: webex
        target: header

  - description: Observability stack (SigNoz + ClickHouse) read access and guarded component restarts
    enabled: false
    endpoint: ${OBSERVABILITY_OPS_MCP_URL:-http://localhost:18023/mcp}
    id: observability-ops
    name: Observability Ops
    transport: http
    # Kendralabs-only agent, opt-in via the `observability-ops-agent`
    # compose profile - disabled by default, same as the other
    # kendralabs-only Azure/Jenkins agents are not seeded here enabled.

  - description: Knowledge Base tools
    enabled: true
    endpoint: ${RAG_SERVER_MCP_URL:-http://localhost:9446/mcp}
    id: knowledge-base
    name: Knowledge Base
    transport: http
    # The RAG server enforces its own Keycloak/OIDC auth on /mcp. Forward the
    # caller's user JWT (per-user RAG group RBAC); in non-user contexts (background
    # reconcile/probe) mint a caipe-platform service token. The gateway rewrites
    # X-CAIPE-Provider-Token into the upstream Authorization: Bearer header.
    credential_sources:
      - kind: caller_token
        name: X-CAIPE-Provider-Token
        target: header
        fallback_client_credentials: true

  - description: Jenkins CI Ops - Jenkins-on-AKS build/queue, ACR, Key Vault, and Terraform state visibility
    enabled: true
    endpoint: ${JENKINS_CI_OPS_MCP_URL:-http://localhost:18021/mcp}
    id: jenkins-ci-ops
    name: Jenkins CI Ops
    transport: http
    # No per-user OAuth provider for Jenkins; resolve the shared Jenkins API
    # token via CAIPE's credential-exchange secret_ref, falling back to a
    # static env var when credential-exchange isn't enabled.
    credential_sources:
      - kind: secret_ref
        name: Authorization
        target: header
        secret_ref: jenkins-ci-ops/api-token
        fallback_env: JENKINS_API_TOKEN

  - description: Azure Power Ops - power on/off and status for Azure compute (AKS clusters, VMs) by customer environment
    enabled: true
    endpoint: ${AZURE_POWER_OPS_MCP_URL:-http://localhost:18017/mcp}
    id: azure-power-ops
    name: Azure Power Ops
    transport: http
    credential_sources:
      - kind: secret_ref
        name: ARM_CLIENT_SECRET
        target: env
        secret_ref: azure-power-ops/arm-client-secret
        fallback_env: AZURE_POWER_OPS_ARM_CLIENT_SECRET

  - description: Azure Cost Ops - cost/spend analysis and budget reporting across Azure subscriptions
    enabled: true
    endpoint: ${AZURE_COST_OPS_MCP_URL:-http://localhost:18018/mcp}
    id: azure-cost-ops
    name: Azure Cost Ops
    transport: http
    credential_sources:
      - kind: secret_ref
        name: ARM_CLIENT_SECRET
        target: env
        secret_ref: azure-cost-ops/arm-client-secret
        fallback_env: AZURE_COST_OPS_ARM_CLIENT_SECRET

  - description: Azure Cluster Ops - AKS cluster lifecycle (scale, upgrade, node pool status) by customer environment
    enabled: true
    endpoint: ${AZURE_CLUSTER_OPS_MCP_URL:-http://localhost:18019/mcp}
    id: azure-cluster-ops
    name: Azure Cluster Ops
    transport: http
    credential_sources:
      - kind: secret_ref
        name: ARM_CLIENT_SECRET
        target: env
        secret_ref: azure-cluster-ops/arm-client-secret
        fallback_env: AZURE_CLUSTER_OPS_ARM_CLIENT_SECRET

  - description: Azure Core Services Ops - status/control for shared Azure platform services (Key Vault, networking, storage)
    enabled: true
    endpoint: ${AZURE_CORE_SERVICES_OPS_MCP_URL:-http://localhost:18020/mcp}
    id: azure-core-services-ops
    name: Azure Core Services Ops
    transport: http
    credential_sources:
      - kind: secret_ref
        name: ARM_CLIENT_SECRET
        target: env
        secret_ref: azure-core-services-ops/arm-client-secret
        fallback_env: AZURE_CORE_SERVICES_OPS_ARM_CLIENT_SECRET

# =============================================================================
# Seed Agents
# =============================================================================

agents: []
